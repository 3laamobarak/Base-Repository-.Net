<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stripe Test Payment - No Framework</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body {
            font-family: Arial;
            padding: 40px;
            max-width: 500px;
            margin: auto;
        }

        #card-element {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 20px 0;
        }

        button {
            padding: 12px 24px;
            background: #6772e5;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            color: #333;
        }
    </style>
</head>
<body>
    <h2>Test Payment with Stripe</h2>
    <p>Enter test card (e.g. 4242 4242 4242 4242, any future expiry, any CVC)</p>

    <div id="card-element"></div>
    <button id="submit">Pay</button>
    <div id="result"></div>

    <script>
        const stripe = Stripe('pk_test_51SfeHrPOHWK1o19HLPxyt0l3cSAnqQLyQKnhwyrbjGi8WWvJitq1gRGZVEXS8K6BukDZnsOUT8P4FPd6lZKUYmKJ00y86nA54c'); // ← YOUR PUBLISHABLE KEY HERE

        const elements = stripe.elements();
        const card = elements.create('card', { style: { base: { fontSize: '16px' } } });
        card.mount('#card-element');

        document.getElementById('submit').addEventListener('click', async () => {
            const clientSecret = prompt("Paste the clientSecret from your API response:");
            if (!clientSecret) return;

            const { error, paymentIntent } = await stripe.confirmCardPayment(clientSecret, {
                payment_method: { card: card }
            });

            const resultDiv = document.getElementById('result');
            if (error) {
                resultDiv.style.color = 'red';
                resultDiv.textContent = error.message;
            } else {
                resultDiv.style.color = 'green';
                resultDiv.textContent = 'Payment succeeded! ID: ' + paymentIntent.id;
            }
        });
    </script>
</body>
</html>
